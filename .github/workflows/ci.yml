name: CI

on:
  pull_request:

# Cancel superseded runs on the same ref (e.g. new commits pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      # smoke.test.mjs is the real gate here: it asserts the CSS invariants (mask
      # support guard, Greek font fallback), locale parity and that the expected assets
      # land in dist/. It reads dist/, so it must run after the build.
      - name: Test
        run: pnpm run test
