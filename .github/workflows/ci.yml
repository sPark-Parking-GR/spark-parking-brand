name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. new commits pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Format check
        run: pnpm run format:check

      # smoke.test.mjs is the real gate here: it asserts the CSS invariants (mask
      # support guard, price-card min-width, Greek font fallback), locale parity and
      # that the expected assets land in dist/.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: dist/
          retention-days: 7
